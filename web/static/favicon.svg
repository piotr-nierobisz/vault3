<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Vault3 mark: three strokes that close a triangle without touching.
       At tab size the outline thins out and has to hold on a light tab bar
       as well as a dark one, so the favicon inverts the mark — the gradient
       becomes the tile and the triangle is knocked out of it. Colours are
       literal here — a favicon is loaded as an image, so the page's theme
       tokens never reach it — and track the dark-theme spectrum: magenta,
       violet, cyan. -->
  <defs>
    <linearGradient id="edge" x1="4" y1="2" x2="60" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ec5fc6"/>
      <stop offset="0.5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#4fd6e6"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#edge)"/>
  <g fill="none" stroke="#0a0a10" stroke-width="6.4" stroke-linecap="round">
    <path d="M34.1 18.14 48.09 42.36"/>
    <path d="M45.99 46H18.01"/>
    <path d="M15.91 42.36 29.9 18.14"/>
  </g>
</svg>
